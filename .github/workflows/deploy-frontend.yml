name: Deploy KlinSync Frontend (S3)

# Publica o build do front no bucket S3 klinsync-frontend (us-east-2).
# Mesmo padrão do tf-vpc: ambiente develop + role vinda do secret AWS_ROLE_ARN_DEVELOP (OIDC).
#
# Secrets (Settings > Environments > develop):
#   AWS_ROLE_ARN_DEVELOP             ARN da role assumida via OIDC (AMZ-GITHUB)
#   VITE_API_URL                    ex.: https://api.meudominio.com.br
#   VITE_RECAPTCHA_SITE_KEY          (opcional)
#   AWS_CLOUDFRONT_DISTRIBUTION_ID   (opcional) invalida o cache após o deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-2
      S3_BUCKET: klinsync-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validar variáveis de build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          [ -n "$VITE_API_URL" ] || { echo "VITE_API_URL não configurada"; exit 1; }

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          npm run build
          test -f dist/index.html || { echo "dist/index.html não gerado"; exit 1; }

      - name: Validar role da AWS
        env:
          AWS_ROLE_ARN_DEVELOP: ${{ secrets.AWS_ROLE_ARN_DEVELOP }}
        run: |
          [ -n "$AWS_ROLE_ARN_DEVELOP" ] || { echo "❌ Secret AWS_ROLE_ARN_DEVELOP não definido ou inacessível"; exit 1; }

      - name: Configurar credenciais da AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Validar autenticação
        run: aws sts get-caller-identity

      - name: Enviar para o S3
        run: |
          BUCKET="s3://${S3_BUCKET}"
          # Assets com hash no nome: cache longo. Sem --delete para não quebrar
          # quem está com a versão anterior aberta.
          aws s3 sync dist/assets "$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # Demais arquivos (ícones, manifest, robots): cache curto.
          aws s3 sync dist "$BUCKET" --exclude "assets/*" --exclude "index.html" --delete \
            --cache-control "public,max-age=300"
          # index.html por último e sem cache: passa a apontar para os assets novos.
          aws s3 cp dist/index.html "$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar CloudFront
        env:
          CF_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          [ -n "$CF_ID" ] || { echo "Sem CloudFront configurado, nada a invalidar"; exit 0; }
          aws cloudfront create-invalidation --distribution-id "$CF_ID" \
            --paths "/index.html" "/manifest.webmanifest" "/robots.txt"
